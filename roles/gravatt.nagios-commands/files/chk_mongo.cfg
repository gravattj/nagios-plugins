
define command {
    #
    # example usage:
    #
    # check_mongodb \
    #   -u myuser \
    #   -p xyz \
    #   -h myhost \
    #   -d mydbname \
    #   -q "mydbname.foo.findOne()"
    #
    # ARG1: database
    # ARG2: user
    # ARG3: password
    # ARG4: query
    # 
    
    command_name chk_mongo
    command_line $USER5$/check_mongodb.sh -d $ARG1$ -u $ARG2$ -p "$ARG3$" -q "$ARG4$" -h "$ARG5$"
}
